name = "backend"
compatibility_date = "2023-12-01"
keep_vars = true

# DATABASE_URL and JWT_SECRET are encrypted Worker secrets.
# Configure them with `npx wrangler secret put <NAME>`; never commit them here.
# Set FRONTEND_URL to the deployed frontend origin to restrict browser API access.

# [vars]
# MY_VAR = "my-variable"

# [[kv_namespaces]]
# binding = "MY_KV_NAMESPACE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "my-bucket"

# [[d1_databases]]
# binding = "DB"
# database_name = "my-database"
# database_id = ""

# [ai]
# binding = "AI"
